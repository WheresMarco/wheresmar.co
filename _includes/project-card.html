{% assign project = include.project %}
<article class="card">
  <a class="card-link" href="{{ project.url | relative_url }}">
    <div class="card-media">
      {% if project.image %}<img src="{{ project.image | relative_url }}" alt="" loading="lazy">{% else %}<span class="card-wordmark">{{ project.title }}</span>{% endif %}
    </div>
    <p class="label">{{ project.type }}</p>
    <h3 class="card-title">{{ project.title }}</h3>
    <p class="card-summary">{{ project.summary }}</p>
  </a>
</article>
